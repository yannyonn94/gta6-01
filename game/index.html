<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kota Karang — open world</title>
<style>
  html, body { margin: 0; height: 100%; background: #0c0f14; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #eef1f5; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  /* ---- HUD ---- */
  #hud { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .25s; }
  #hud.on { opacity: 1; }
  #wanted { position: absolute; top: 14px; right: 16px; font-size: 22px; letter-spacing: 4px; text-shadow: 0 2px 6px #000; }
  #cash { position: absolute; top: 42px; right: 18px; font-size: 18px; color: #9fe3a0; text-shadow: 0 2px 6px #000; }
  #healthbar { position: absolute; left: 18px; bottom: 100px; width: 180px; height: 12px; background: rgba(58,32,32,.8); border: 1px solid #000; }
  #healthbar > div { height: 100%; background: #e5534b; width: 100%; }
  #objective { position: absolute; top: 14px; left: 16px; max-width: 380px; background: rgba(10,12,16,.55); padding: 8px 12px; border-left: 3px solid #f2c94c; font-size: 14px; line-height: 1.4; }
  #msg { position: absolute; top: 84px; left: 50%; transform: translateX(-50%); font-size: 20px; text-shadow: 0 2px 8px #000; opacity: 0; transition: opacity .3s; white-space: nowrap; }
  #minimap { position: absolute; left: 16px; bottom: 16px; width: 160px; height: 160px; background: rgba(8,10,14,.6); border: 1px solid rgba(255,255,255,.25); }

  /* ---- start / pause ---- */
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: radial-gradient(circle at 50% 35%, #1d2432, #07090d); z-index: 10; }
  #overlay.hidden { display: none; }
  #overlay h1 { margin: 0; font-size: 54px; letter-spacing: 3px; }
  #overlay p { max-width: 600px; text-align: center; color: #c6ccd8; line-height: 1.5; margin: 0; }
  #overlay button { pointer-events: auto; cursor: pointer; background: #f2c94c; color: #14161c; border: 0; padding: 12px 28px; font-size: 18px; font-weight: 700; border-radius: 6px; }
  #overlay button + button { background: #2c3444; color: #eef1f5; }
  kbd { background: #252b38; border: 1px solid #4a5266; border-radius: 4px; padding: 1px 6px; font-size: 13px; }
</style>
</head>
<body>
<div id="app"></div>

<div id="hud">
  <div id="objective">Misi: —</div>
  <div id="wanted">★</div>
  <div id="cash">$0</div>
  <div id="msg"></div>
  <div id="healthbar"><div></div></div>
  <canvas id="minimap" width="160" height="160"></canvas>
</div>

<div id="overlay">
  <h1>KOTA KARANG</h1>
  <p>Kota pantai orisinal. Jalan kaki, curi mobil, kabur dari polisi, selesaikan misi.</p>
  <button id="btn-start">Mulai baru</button>
  <button id="btn-continue">Lanjutkan progres</button>
  <p style="font-size:13px">
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> jalan &nbsp; <kbd>Shift</kbd> lari &nbsp;
    <kbd>E</kbd> masuk/keluar mobil &nbsp; <kbd>Spasi</kbd> rem / tembak &nbsp; <kbd>Mouse</kbd> lihat &nbsp;
    <kbd>Esc</kbd> jeda
  </p>
</div>

<script src="/vendor/three.min.js"></script>
<script type="module" src="/src/game_main.js"></script>
</body>
</html>
